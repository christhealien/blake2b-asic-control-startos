name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['master']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: package-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/s9-build.yml   # Start9's build workflow, run on ubuntu-24.04 (see that file)
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
